<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MathHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="maths.jpg">
</head>

<body class="login-body">

  <main class="login-page">
    <div class="login-brand">
      <a href="index.html" class="login-logo">Math<span>Hub</span></a>
      <p>Learn Mathematics. Understand &amp; Master it.</p>
    </div>

    <section class="login-card">
      <div class="login-heading">
        <p class="small-title">WELCOME BACK</p>
        <h1>Login to MathHub</h1>
        <p>Continue your lessons, practice and progress.</p>
      </div>

      <form id="loginForm" class="login-form">

        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
              👁
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>

          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="login-submit">
          Login →
        </button>

        <p id="loginMessage" class="login-message" aria-live="polite"></p>
      </form>

      <div class="login-divider">
        <span>OR</span>
      </div>

      <div class="login-signup">
        <p>Don't have a MathHub account?</p>
        <button type="button" id="createAccountBtn">Create Account</button>
      </div>
    </section>

    <p class="login-footer">
      © 2026 MathHub. Learn. Practice. Master.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
