<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MathHub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="maths.jpg">
</head>

<body class="login-body">

  <main class="login-page">
    <div class="login-brand">
      <a href="index.html" class="login-logo">Math<span>Hub</span></a>
      <p>Learn Mathematics. Understand &amp; Master it.</p>
    </div>

    <section class="login-card">
      <div class="login-heading">
        <p class="small-title">GET STARTED</p>
        <h1>Create your MathHub account</h1>
        <p>Save your learning progress and continue from where you stopped.</p>
      </div>

      <form id="registerForm" class="login-form">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" name="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email Address</label>
          <input type="email" id="registerEmail" name="email" placeholder="Enter your email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <div class="password-field">
            <input type="password" id="registerPassword" name="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>
            <button type="button" id="toggleRegisterPassword" class="password-toggle" aria-label="Show password">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" minlength="6" required>
            <button type="button" id="toggleConfirmPassword" class="password-toggle" aria-label="Show password">👁</button>
          </div>
        </div>

        <button type="submit" class="login-submit">Create Account →</button>
        <p id="registerMessage" class="login-message" aria-live="polite"></p>
      </form>

      <div class="login-divider"><span>OR</span></div>

      <div class="login-signup">
        <p>Already have a MathHub account?</p>
        <button type="button" id="backToLogin">Login</button>
      </div>
    </section>

    <p class="login-footer">© 2026 MathHub. Learn. Practice. Master.</p>
  </main>

  <script src="register.js"></script>
</body>
</html>
